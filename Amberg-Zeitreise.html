<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Zeitreise durch Amberg</title>
<style>
/* =========================================================================
   FARBEN & DESIGN-TOKENS
   ========================================================================= */
:root{
  --bg:#ece3cc; --bg2:#f5efdd; --card:#fbf6e8;
  --ink:#2a2420; --muted:#6b6152; --line:#d2c39f;
  --accent:#1f5f8b;      /* Vils-Blau  */
  --accent2:#a8432a;     /* Ziegel-Rot */
  --good:#3f7d3f; --warn:#c9772a; --bad:#b23a2e;
  --brick:#a8432a; --brick-ink:#fbf6e8;
  --shadow:0 6px 20px rgba(60,45,25,.18);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#141824; --bg2:#1b2130; --card:#212a3a;
  --ink:#eae6da; --muted:#9aa3b4; --line:#313c50;
  --accent:#5aa9d6; --accent2:#e0895a;
  --good:#6bbf6b; --warn:#e0a44a; --bad:#e0685c;
  --brick:#8f3a26; --brick-ink:#f3e7d6;
  --shadow:0 6px 22px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  line-height:1.5; overscroll-behavior-y:contain;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

/* ---- Kopfzeile ---- */
header{
  position:sticky;top:0;z-index:50;
  background:var(--bg2); border-bottom:3px solid var(--accent);
  padding:10px 14px; display:flex;align-items:center;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
header .brand{font-weight:800;font-size:17px;letter-spacing:.3px;flex:1;display:flex;align-items:center;gap:8px;}
header .brand .glyph{font-size:20px;}
.iconbtn{
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  width:44px;height:44px;border-radius:12px;font-size:19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.iconbtn:active{transform:scale(.94);}

main{flex:1;padding:16px 16px 40px;}
.hidden{display:none !important;}

/* ---- Mauer-Fortschritt ---- */
.wall{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:4px 0 2px;}
.brick{
  width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;background:var(--line);color:transparent;
  border:1px solid rgba(0,0,0,.12);transition:transform .35s,background .35s,color .35s;
}
.brick.filled{background:var(--brick);color:var(--brick-ink);box-shadow:0 2px 6px rgba(0,0,0,.2);animation:pop .4s;}
@keyframes pop{0%{transform:scale(0.4) rotate(-8deg);}70%{transform:scale(1.15) rotate(3deg);}100%{transform:scale(1);}}
.wall-cap{text-align:center;color:var(--muted);font-size:12.5px;margin-top:6px;letter-spacing:.5px;}

/* ---- Karten ---- */
.card{
  background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);margin-bottom:16px;
}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent2);}
h1{font-size:26px;line-height:1.15;margin:6px 0 10px;letter-spacing:.3px;}
h2{font-size:21px;margin:2px 0 10px;}
p{margin:0 0 12px;}
.lead{font-size:16.5px;}

/* ---- Buttons ---- */
.btn{
  display:block;width:100%;border:none;border-radius:14px;
  padding:16px;font-size:18px;font-weight:800;cursor:pointer;
  background:var(--accent2);color:#fff;box-shadow:var(--shadow);letter-spacing:.3px;
}
.btn:active{transform:translateY(1px) scale(.99);}
.btn.secondary{background:var(--accent);}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:2px solid var(--line);}
.btn.small{padding:12px;font-size:15px;}
.btn+.btn{margin-top:10px;}
.link{background:none;border:none;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;padding:8px;}

/* ---- Eingabe ---- */
.answer-row{display:flex;gap:8px;margin:6px 0 4px;}
input[type=text]{
  flex:1;font-size:19px;padding:14px;border-radius:12px;border:2px solid var(--line);
  background:var(--bg2);color:var(--ink);min-width:0;
}
input[type=text]:focus{outline:none;border-color:var(--accent);}
.feedback{font-weight:800;margin:8px 0 0;min-height:22px;}
.feedback.ok{color:var(--good);}
.feedback.no{color:var(--bad);}
.hintbox{margin-top:10px;padding:12px 14px;border-left:4px solid var(--warn);background:var(--bg2);border-radius:8px;font-size:15px;}

/* ---- Stationsliste ---- */
.station-item{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;
  border:2px solid var(--line);background:var(--card);margin-bottom:10px;text-align:left;
  width:100%;cursor:pointer;color:var(--ink);
}
.station-item:disabled{opacity:.55;cursor:not-allowed;}
.station-item .num{
  width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;
}
.station-item.done .num{background:var(--good);}
.station-item.locked .num{background:var(--muted);}
.station-item .st-body{flex:1;min-width:0;}
.station-item .st-name{font-weight:800;font-size:16px;}
.station-item .st-sub{font-size:13px;color:var(--muted);}
.station-item .st-state{font-size:22px;flex:none;}

/* ---- GPS-Radar / Kompass ---- */
.radar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 2px;}
.compass{
  width:170px;height:170px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 40%,var(--bg2),var(--card));
  border:6px solid var(--accent);box-shadow:var(--shadow);
}
.compass .cardinal{position:absolute;font-size:12px;font-weight:800;color:var(--muted);left:50%;top:50%;transform:translate(-50%,-50%);}
.compass .n{top:10px;} .compass .s{top:auto;bottom:8px;} .compass .e{left:auto;right:10px;} .compass .w{left:10px;}
.needle{
  position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:center;
  transition:transform .25s ease-out;
}
.needle::before{
  content:"";position:absolute;left:-11px;top:-64px;
  border-left:11px solid transparent;border-right:11px solid transparent;
  border-bottom:60px solid var(--accent2);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
}
.needle::after{
  content:"";position:absolute;left:-7px;top:4px;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-top:40px solid var(--line);
}
.dist{font-size:34px;font-weight:900;letter-spacing:.5px;}
.dist small{font-size:16px;font-weight:700;color:var(--muted);}
.proximity{font-size:15px;font-weight:800;padding:5px 12px;border-radius:999px;}
.prox-cold{background:#cfe4f1;color:#134a6b;} .prox-warm{background:#f6e2c4;color:#7a4410;} .prox-hot{background:#cdeecd;color:#1e5a1e;}
[data-theme="dark"] .prox-cold{background:#1c3a4d;color:#a9d6ef;}
[data-theme="dark"] .prox-warm{background:#4a3411;color:#f0c98a;}
[data-theme="dark"] .prox-hot{background:#1e3a1e;color:#a9e0a9;}
.gps-note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;}
.finder-hint{background:var(--bg2);border-radius:12px;padding:12px 14px;font-size:15px;text-align:center;border:1px dashed var(--line);}

.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent);color:#fff;margin-bottom:8px;letter-spacing:.5px;}
.badge.grey{background:var(--muted);}
.divider{height:1px;background:var(--line);margin:14px 0;}
.centered{text-align:center;}
.small-muted{font-size:13px;color:var(--muted);}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.settings-row:last-child{border-bottom:none;}
.confetti{position:fixed;top:-10px;font-size:22px;pointer-events:none;z-index:200;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important;transition-duration:.05s !important;}
}
</style>
<script>
/* Scharfe Kante unter der iPadOS-Statusleiste (iPadOS 26/27).
   WebKit legt in Web-Apps vom Homebildschirm am oberen Rand sonst einen
   weichen Verlauf ueber den Inhalt. Er entfaellt, wenn dort eine deckende
   Leiste liegt - ein bildschirmfuellender Kasten genuegt nicht (am
   13.10.2026 auf iPadOS 27 geprueft). Das Skript legt deshalb einen 16 px
   hohen, deckenden Streifen an den oberen Rand und rueckt alles, was in
   diese 16 px hineinragt, um 16 px nach unten. Laeuft nur in der App vom
   Homebildschirm, nicht in Safari und nicht in einem Rahmen; mit #kante in
   der Adresse laesst es sich zum Pruefen erzwingen. */
(function(){
  if(window.top!==window) return;
  var pruef=/kante/i.test(location.hash||'');
  var alsApp=(navigator.standalone===true) ||
             (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!alsApp && !pruef) return;

  var HOCH=16;
  function leer(f){ return !f || f==='transparent' || f.replace(/\s/g,'')==='rgba(0,0,0,0)'; }
  function seite(){
    var s=getComputedStyle(document.body), f=s.backgroundColor, b=s.backgroundImage;
    if(leer(f) && (!b || b==='none')){
      s=getComputedStyle(document.documentElement); f=s.backgroundColor; b=s.backgroundImage;
    }
    return { farbe: leer(f) ? '#ffffff' : f, bild: (b && b!=='none') ? b : '' };
  }
  /* Faerbt dieses Element am oberen Rand etwas sichtbar ein? */
  function tinte(n){
    var r=n.getBoundingClientRect();
    if(r.top>=HOCH || r.bottom<=0 || r.width<=0) return false;
    var s=getComputedStyle(n);
    if(s.display==='none' || s.visibility==='hidden' || s.opacity==='0') return false;
    if(n.id==='randKante') return false;
    var t=n.tagName.toLowerCase();
    if(t==='img'||t==='svg'||t==='canvas'||t==='video') return true;
    if(!leer(s.backgroundColor) || s.backgroundImage!=='none') return true;
    if(parseFloat(s.borderTopWidth)>0) return true;
    var kn=n.childNodes;
    for(var j=0;j<kn.length;j++)
      if(kn[j].nodeType===3 && kn[j].nodeValue.replace(/\s/g,'')) return true;
    for(var i=0;i<n.children.length;i++) if(tinte(n.children[i])) return true;
    return false;
  }
  function ragtRein(z){
    for(var i=0;i<z.children.length;i++) if(tinte(z.children[i])) return true;
    return false;
  }
  function luft(z){
    if(z.dataset.kanteLuft) return;
    if(!ragtRein(z) && !tinte(z)) return;    /* noch nichts oben - spaeter nochmal */
    z.dataset.kanteLuft='1';
    var p=parseFloat(getComputedStyle(z).paddingTop)||0;
    if(p>=HOCH) return;
    z.style.paddingTop=(p+HOCH)+'px';
  }
  function sichtbar(n,s){
    return s.display!=='none' && s.visibility!=='hidden' && n.id!=='randKante';
  }
  /* bildschirmfuellende fixierte Kaesten */
  function kaesten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if(s.position!=='fixed' || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.9 && r.height>=innerHeight*0.9) raus.push(n);
    }
    return raus;
  }
  /* Leisten am oberen Rand (fixiert oder klebend, aber kein Vollbildkasten) */
  function leisten(){
    var alle=document.querySelectorAll('body > *, body > * > *'), raus=[];
    for(var i=0;i<alle.length;i++){
      var n=alle[i], s=getComputedStyle(n);
      if((s.position!=='fixed' && s.position!=='sticky') || !sichtbar(n,s)) continue;
      var r=n.getBoundingClientRect();
      if(r.top<=4 && r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6) raus.push(n);
    }
    return raus;
  }
  /* Liegt oben schon eine deckende Leiste, ist nichts zu tun. */
  function schonGut(){
    var st=document.elementsFromPoint ? document.elementsFromPoint(Math.round(innerWidth/2),2) : [];
    for(var i=0;i<st.length;i++){
      var n=st[i];
      if(n.id==='randKante') continue;
      if(n===document.body || n===document.documentElement) return false;
      var s=getComputedStyle(n), r=n.getBoundingClientRect();
      return (s.position==='fixed'||s.position==='sticky') && r.top<=4 &&
             r.width>=innerWidth*0.8 && r.height>=6 && r.height<=innerHeight*0.6 &&
             !leer(s.backgroundColor);
    }
    return false;
  }
  var band=null;
  function streifen(farbe){
    if(!band){
      band=document.createElement('div');
      band.id='randKante'; band.setAttribute('aria-hidden','true');
      band.style.cssText='position:fixed;left:0;top:0;width:100%;height:'+HOCH+'px;'+
        'z-index:2147483646;pointer-events:none';
      document.body.appendChild(band);
    }
    band.style.display='block';
    if(farbe){
      band.style.backgroundColor=farbe;
      band.style.backgroundImage='none';
      return;
    }
    var s=getComputedStyle(document.body), h=seite();
    band.style.backgroundColor=h.farbe;
    band.style.backgroundImage=h.bild||'none';
    band.style.backgroundAttachment='fixed';
    if(h.bild && s.backgroundAttachment!=='fixed')
      band.style.backgroundSize='100% '+Math.max(innerHeight,document.body.scrollHeight)+'px';
  }
  var schild=null;
  function zeigen(txt){
    if(!pruef) return;
    if(!schild){
      schild=document.createElement('div');
      schild.style.cssText='position:fixed;left:6px;bottom:52px;z-index:2147483647;max-width:92%;'+
        'padding:6px 9px;border-radius:8px;background:#ffe600;color:#000;'+
        'font:600 12px/1.35 -apple-system,sans-serif;white-space:pre-wrap;pointer-events:none';
      document.body.appendChild(schild);
    }
    schild.textContent='Kante K6 · '+innerWidth+'x'+innerHeight+'\n'+txt;
  }
  function name(n){
    if(n.id) return '#'+n.id;
    var c=(typeof n.className==='string'&&n.className.trim())?'.'+n.className.trim().split(/\s+/)[0]:'';
    return n.tagName.toLowerCase()+c;
  }
  function malen(){
    var b=document.body; if(!b) return;
    if(schonGut()){
      if(band) band.style.display='none';
      zeigen('oben liegt schon eine deckende Leiste');
      return;
    }
    var k=kaesten(), l=leisten(), h=null, farbe=null, text=[];
    for(var i=0;i<k.length;i++){
      var z=k[i], s=getComputedStyle(z);
      if(!z.dataset.kante){
        if(leer(s.backgroundColor)){
          if(!h) h=seite();
          z.style.backgroundColor=h.farbe;
          if(s.backgroundImage==='none' && h.bild) z.style.backgroundImage=h.bild;
        }
        z.dataset.kante='1';
        s=getComputedStyle(z);
      }
      luft(z);
      text.push(name(z)+' bg='+s.backgroundColor+(s.backgroundImage!=='none'?'+Verlauf':''));
    }
    for(var j=0;j<l.length;j++){
      var le=l[j], sl=getComputedStyle(le);
      if(!tinte(le) && !ragtRein(le)) continue;
      if(!farbe && !leer(sl.backgroundColor)) farbe=sl.backgroundColor;
      luft(le);
      text.push('Leiste '+name(le)+' bg='+sl.backgroundColor);
    }
    if(!k.length && !l.length){ luft(b); text.push('kein Kasten, nur Streifen'); }
    streifen(farbe);
    zeigen(text.join('\n'));
  }
  var warte=null;
  function spaeter(){
    if(warte) return;
    warte=setTimeout(function(){ warte=null; malen(); },200);
  }
  try{
    new MutationObserver(spaeter).observe(document.documentElement,
      {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',malen);
  else malen();
  addEventListener('load',spaeter);
  addEventListener('resize',spaeter);
  addEventListener('orientationchange',spaeter);
})();
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="glyph">🏰</span><span>Zeitreise durch Amberg</span></div>
    <button class="iconbtn" id="btnTheme" title="Tag / Nacht" aria-label="Tag- oder Nachtmodus">🌙</button>
    <button class="iconbtn" id="btnHome" title="Übersicht" aria-label="Zur Übersicht">🧭</button>
  </header>
  <main id="main"><!-- Inhalt wird per JavaScript eingesetzt --></main>
</div>

<script>
/* =========================================================================
   ▓▓▓  KONFIGURATION – HIER kannst du (Mike) alles anpassen  ▓▓▓
   -------------------------------------------------------------------------
   • coords : GPS-Koordinaten der Station (recherchiert – vor Ort prüfen!)
   • answers: alle akzeptierten Antworten (Groß/Klein & Komma egal)
   • Zahlen bitte mit Dezimalkomma im Text (z.B. "2,5 Meter").
   Nach einem Testlauf einfach die Werte unten korrigieren.
   ========================================================================= */

const SETTINGS = {
  unlockRadiusM : 35,      // Radius in Metern, ab dem eine Station "erreicht" gilt
  requireGPS    : true,    // false = Aufgaben sofort spielbar (z.B. zum Testen am Schreibtisch)
  sequential    : true,    // true = Stationen der Reihe nach; false = frei wählbar
  teacherCode   : "1034",  // Lehrer-Code (Ersterwähnung Ambergs) – schaltet Stationen von Hand frei / öffnet Test-Modus
  startRiddleAnswer : ["stadtbrille","stadt brille","die stadtbrille"], // Antwort des Start-Rätsels
  solutionWord  : "STADTMAUER"   // Lösungswort, das sich Stein für Stein aufbaut
};

const STATIONS = [
  {
    name:"Nabburger Tor", emoji:"🏯", letter:"S",
    coords:{lat:49.4447872, lng:11.8626106},
    finder:"Ein mächtiges Stadttor mit zwei runden Türmen im Osten der Altstadt.",
    history:"Das Nabburger Tor ist das prächtigste der alten Amberger Stadttore. Es wurde vor sehr langer Zeit gebaut – schon im Jahr 1382 stand es in einer Urkunde. Um 1587 bekam es sein schmuckes Aussehen mit den beiden dicken Rundtürmen. Es gehört zur fast 3 Kilometer langen Stadtmauer, die die Altstadt wie ein Ei umschließt. Früher hatte die Mauer viele Türme und Tore und machte Amberg beinahe uneinnehmbar.",
    task:"Schau dir das Tor genau an: Wie viele große runde Türme hat das Nabburger Tor?",
    answers:["2","zwei"],
    hint:"Links und rechts vom Torbogen steht je ein runder Turm – zähl beide."
  },
  {
    name:"Rathaus am Marktplatz", emoji:"🏛️", letter:"T",
    coords:{lat:49.4455224, lng:11.8586255},
    finder:"Das prächtige Haus mit den Bögen und der Turmuhr am großen Platz mitten in der Stadt.",
    history:"Das Rathaus steht am schönsten Platz der Stadt. Schon vor über 650 Jahren stand hier ein Rathaus. Nach einem großen Brand im Jahr 1356 wurde es neu aufgebaut. Es ist teils gotisch, teils im Stil der Renaissance gebaut. Bis heute arbeitet hier der Bürgermeister von Amberg.",
    task:"Wie heißt der große Platz, an dem das Rathaus steht? Lies es auf einem Straßenschild an einer Hausecke.",
    answers:["marktplatz","markt platz","der marktplatz","am marktplatz"],
    hint:"Suche an einer Hausecke ein Straßenschild. Das Wort endet auf …platz."
  },
  {
    name:"Hochzeitsbrunnen", emoji:"⛲", letter:"A",
    coords:{lat:49.4453747, lng:11.8581949},
    finder:"Direkt vor dem Rathaus plätschert ein Brunnen mit lustigen Figuren.",
    history:"Dieser Brunnen erinnert an die berühmte „Amberger Hochzeit“ im Jahr 1474. Damals heiratete Prinzessin Margarete aus Bayern-Landshut den Pfälzer Prinzen Philipp – mitten in Amberg. Die Feier dauerte ganze fünf Tage! Der Brunnen wurde im Jahr 2000 vom Künstler Engelbert Süß geschaffen. Zwei der Figuren sind übrigens lustige Narren.",
    task:"Auf dem Brunnen stehen Figuren. Zähle sie: Wie viele Figuren siehst du?",
    answers:["4","vier"],
    hint:"Es sind das Brautpaar und zwei Narren mit Narrenkappe – zähl alle zusammen."
  },
  {
    name:"Basilika St. Martin", emoji:"⛪", letter:"D",
    coords:{lat:49.4449638, lng:11.8580903},
    finder:"Die riesige Kirche mit dem sehr hohen Turm – kaum zu übersehen.",
    history:"Diese gewaltige Kirche wurde in rund 100 Jahren gebaut und um 1521 fertig. Ihr Turm ist fast 92 Meter hoch! Nach dem Dom in Regensburg ist St. Martin die größte gotische Kirche der ganzen Oberpfalz. Benannt ist sie nach einem Heiligen, der – so erzählt die Legende – seinen warmen Mantel mit einem frierenden armen Mann teilte.",
    task:"Nach welchem Heiligen ist die Kirche benannt? Sein Name steckt im Namen der Kirche.",
    answers:["martin","sankt martin","st martin","st. martin","der heilige martin","heiliger martin"],
    hint:"Denk an den Laternenumzug im November … Sankt …?"
  },
  {

const STORE_KEY = "amberg_zeitreise_v1";
let state = load() || { started:false, solved:[], theme:"light", testMode:false };
if(!Array.isArray(state.solved)) state.solved = [];

const main = document.getElementById('main');
let watchId=null, geoOk=null, curPos=null, heading=null, activeStation=null, wrongCount={};

/* ---------- Speicher ---------- */
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ return null; } }

/* ---------- Theme ---------- */
function applyTheme(){ document.documentElement.setAttribute('data-theme', state.theme==="dark"?"dark":"light");
  document.getElementById('btnTheme').textContent = state.theme==="dark" ? "☀️" : "🌙"; }
document.getElementById('btnTheme').onclick = ()=>{ state.theme = state.theme==="dark"?"light":"dark"; save(); applyTheme(); };
document.getElementById('btnHome').onclick = ()=>{ if(state.started) showHub(); };
applyTheme();

/* ---------- Antwort-Vergleich (tolerant, mit Dezimalkomma) ---------- */
function norm(s){
  return (s||"").toString().toLowerCase().trim()
    .replace(/ß/g,"ss").replace(/[.!?]+$/,"")
    .replace(/,(\d)/g,".$1")     // Dezimalkomma -> Punkt für Zahlen
    .replace(/\s+/g," ");
}
function isCorrect(input, answers){
  const a = norm(input);
  if(!a) return false;
  return answers.some(ans=>{
    const n = norm(ans);
    if(a===n) return true;
    if(n.length>=4 && a.includes(n)) return true; // "der marktplatz" enthält "marktplatz"
    return false;
  });
}

/* ---------- Geometrie: Entfernung & Peilung ---------- */
function toRad(d){return d*Math.PI/180;}
function distanceM(a,b){
  const R=6371000, dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearing(a,b){
  const y=Math.sin(toRad(b.lng-a.lng))*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat)) - Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lng-a.lng));
  return (Math.atan2(y,x)*180/Math.PI + 360)%360;
}
function compassName(deg){
  const dirs=["Norden ↑","Nordosten ↗","Osten →","Südosten ↘","Süden ↓","Südwesten ↙","Westen ←","Nordwesten ↖"];
  return dirs[Math.round(deg/45)%8];
}

/* ---------- GPS starten ---------- */
function startGeo(){
  if(!("geolocation" in navigator)){ geoOk=false; return; }
  if(watchId!==null) return;
  watchId = navigator.geolocation.watchPosition(
    p=>{ geoOk=true; curPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}; refreshRadar(); },
    e=>{ geoOk=false; refreshRadar(); },
    { enableHighAccuracy:true, maximumAge:2000, timeout:15000 }
  );
}
/* ---------- Kompass (Ausrichtung) ---------- */
function onOrient(e){
  if(typeof e.webkitCompassHeading==="number"){ heading=e.webkitCompassHeading; }
  else if(e.absolute && typeof e.alpha==="number"){ heading=(360-e.alpha)%360; }
  else if(typeof e.alpha==="number"){ heading=(360-e.alpha)%360; }
  refreshNeedle();
}
function enableCompass(){
  if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
    DeviceOrientationEvent.requestPermission().then(r=>{ if(r==="granted"){ window.addEventListener("deviceorientation",onOrient,true);} }).catch(()=>{});
  } else {
    window.addEventListener("deviceorientationabsolute",onOrient,true);
    window.addEventListener("deviceorientation",onOrient,true);
  }
  const b=document.getElementById('btnCompass'); if(b) b.textContent="Kompass aktiv ✓";
}

      <p class="small-muted">Tipp: Erlaube dem Handy den Zugriff auf den Standort, wenn es fragt.</p>

    </div>`;
  const go=()=>{

  document.getElementById('riddleGo').onclick=go;
  document.getElementById('riddleIn').addEventListener('keydown',e=>{ if(e.key==="Enter") go(); });

function beginHunt(){
  if(SETTINGS.requireGPS && !state.testMode) startGeo();
  showHub();
}

/* ---------- ÜBERSICHT (Hub) ---------- */
function nextIndex(){
  for(let i=0;i<STATIONS.length;i++){ if(!state.solved.includes(i)) return i; }
  return -1; // alles gelöst
}
function unlockedForList(i){
  if(!SETTINGS.sequential) return true;
  if(state.solved.includes(i)) return true;
  return i===nextIndex();
}

function wallHTML(){
  const w=SETTINGS.solutionWord;
  let bricks="";
  for(let i=0;i<STATIONS.length;i++){
    const filled=state.solved.includes(i);
    bricks+=`<div class="brick ${filled?'filled':''}">${filled?(STATIONS[i].letter||"■"):"■"}</div>`;
  }
  return `<div class="wall">${bricks}</div>
          <div class="wall-cap">${state.solved.length} von ${STATIONS.length} Steinen gesammelt</div>`;
}

function showHub(){
  stopRadar();
  const done=state.solved.length;
  if(done===STATIONS.length){ showFinal(); return; }
  let items="";
  STATIONS.forEach((s,i)=>{
    const solved=state.solved.includes(i);
    const open=unlockedForList(i);
    const cls = solved?"done":(open?"":"locked");
    const state_icon = solved?"✅":(open?"➡️":"🔒");
    items += `<button class="station-item ${cls}" data-i="${i}" ${open?"":"disabled"}>
        <div class="num">${i+1}</div>
        <div class="st-body">
          <div class="st-name">${s.emoji} ${s.name}</div>
          <div class="st-sub">${solved?"Gelöst":(open?"Deine nächste Station":"Erst noch gesperrt")}</div>
        </div>
        <div class="st-state">${state_icon}</div>
      </button>`;
  });
  main.innerHTML = `
    <div class="card">
      <div class="eyebrow">Dein Fortschritt</div>
      ${wallHTML()}
    </div>
    <div class="card">
      <h2>Stationen</h2>
      ${items}
      ${state.testMode?'<p class="small-muted centered">🧪 Test-Modus aktiv – Aufgaben ohne GPS spielbar.</p>':''}
    </div>
    <button class="link" id="reset">Fortschritt zurücksetzen</button>`;
  main.querySelectorAll('.station-item').forEach(b=>{
    if(!b.disabled) b.onclick=()=>openStation(parseInt(b.dataset.i,10));
  });
  document.getElementById('reset').onclick=()=>{
    if(confirm("Wirklich von vorne beginnen? Alle Steine gehen verloren.")){
      state={ started:true, solved:[], theme:state.theme, testMode:state.testMode }; save(); showHub();
    }
  };
}

/* ---------- STATION ---------- */
function openStation(i){
  activeStation=i;
  const s=STATIONS[i];
  const solved=state.solved.includes(i);
  const gpsGate = SETTINGS.requireGPS && !state.testMode && !solved;

  main.innerHTML = `
    <div class="card">
      <div class="eyebrow">Station ${i+1} von ${STATIONS.length}</div>
      <h1>${s.emoji} ${s.name}</h1>
      <div id="stationInner"></div>
    </div>
    <button class="btn ghost small" id="backHub">← Zurück zur Übersicht</button>`;
  document.getElementById('backHub').onclick=showHub;

  if(solved){ renderTask(i,true); return; }
  if(gpsGate){ renderRadar(i); }
  else { renderTask(i,false); }
}

/* Radar-Ansicht bis die Station erreicht ist */
function renderRadar(i){
  const s=STATIONS[i];
  const inner=document.getElementById('stationInner');
  inner.innerHTML = `
    <p class="badge grey">🎯 Finde diesen Ort</p>
    <div class="finder-hint">${s.finder}</div>
    <div class="radar-wrap" style="margin-top:14px">
      <div class="compass">
        <span class="cardinal n">N</span><span class="cardinal e">O</span>
        <span class="cardinal s">S</span><span class="cardinal w">W</span>
        <div class="needle" id="needle"></div>
      </div>
      <div class="dist" id="distTxt">– <small>m</small></div>
      <div class="proximity prox-cold" id="proxTxt">Suche GPS …</div>
    </div>
    <p class="gps-note" id="gpsNote"></p>
    <button class="btn secondary small" id="btnCompass" style="margin-top:6px">Kompass aktivieren</button>
    <div class="divider"></div>
    <button class="btn ghost small" id="manualUnlock">Ich bin da – Station mit Code freischalten</button>`;
  document.getElementById('btnCompass').onclick=enableCompass;
  document.getElementById('manualUnlock').onclick=()=>askTeacher(()=>renderTask(i,false));
  if(!(SETTINGS.requireGPS)) return;
  startGeo();
  refreshRadar();
}

function refreshRadar(){
  if(activeStation===null) return;
  const distEl=document.getElementById('distTxt'); if(!distEl) return; // nicht auf Radar-Screen
  const s=STATIONS[activeStation];
  const note=document.getElementById('gpsNote');
  const prox=document.getElementById('proxTxt');
  if(geoOk===false || !curPos){
    distEl.innerHTML=`– <small>m</small>`;
    prox.className="proximity prox-cold"; prox.textContent="Warte auf GPS-Signal …";
    if(note) note.textContent="Standort erlauben. Draußen und mit gutem Empfang klappt es am besten. Notfalls unten den Code-Knopf nutzen.";
    return;
  }
  const d=Math.round(distanceM(curPos,s.coords));
  distEl.innerHTML=`${d} <small>m</small>`;
  if(note) note.textContent = curPos.acc?`Genauigkeit ca. ±${Math.round(curPos.acc)} m`:"";
  if(d<=SETTINGS.unlockRadiusM){
    if(navigator.vibrate) navigator.vibrate([80,50,80]);
    renderTask(activeStation,false); return;
  }
  if(d<80){ prox.className="proximity prox-hot"; prox.textContent="🔥 Ganz nah – such den Ort!"; }
  else if(d<250){ prox.className="proximity prox-warm"; prox.textContent="🙂 Wärmer … weiter so!"; }
  else { prox.className="proximity prox-cold"; prox.textContent="❄️ Noch ein Stück – lauf los!"; }
  refreshNeedle();
}
function refreshNeedle(){
  const n=document.getElementById('needle'); if(!n||activeStation===null||!curPos) return;
  const s=STATIONS[activeStation];
  const brg=bearing(curPos,s.coords);
  let rot=brg;
  const prox=document.getElementById('proxTxt');
  if(heading!==null){ rot=brg-heading; }
  else if(prox && prox.textContent.indexOf("Richtung")===-1){
    /* ohne Kompass: Himmelsrichtung als Text ergänzen */
    const base=prox.textContent.split(" · ")[0];
    prox.textContent = base+" · Richtung "+compassName(brg);
  }
  n.style.transform=`rotate(${rot}deg)`;
}
function stopRadar(){ activeStation=null; }

/* Aufgabe anzeigen */
function renderTask(i, alreadySolved){
  activeStation=i;
  const s=STATIONS[i];
  const inner=document.getElementById('stationInner');
  wrongCount[i]=wrongCount[i]||0;
  inner.innerHTML = `
    <p class="badge">📖 Geschichte</p>
    <p class="lead">${s.history}</p>
    <div class="divider"></div>
    <p class="badge" style="background:var(--accent2)">🧩 Deine Aufgabe</p>
    <p class="lead"><b>${s.task}</b></p>
    ${alreadySolved ? `
      <p class="feedback ok">✅ Schon gelöst! Du hast den Stein „${s.letter}“ bekommen.</p>
      <button class="btn secondary" id="toNext">Weiter →</button>
    ` : `
      <div class="answer-row">
        <input type="text" id="ansIn" placeholder="Deine Antwort …" autocomplete="off" enterkeyhint="done">
        <button class="btn" style="width:auto;padding:14px 18px" id="ansGo">Prüfen</button>
      </div>
      <div class="feedback" id="ansFb"></div>
      <button class="link hidden" id="showHint">Ich brauche einen Tipp 💡</button>
      <div class="hintbox hidden" id="hintBox">💡 ${s.hint}</div>
    `}`;

  if(alreadySolved){
    document.getElementById('toNext').onclick=showHub; return;
  }
  const go=()=>{
    const val=document.getElementById('ansIn').value;
    const fb=document.getElementById('ansFb');
    if(isCorrect(val, s.answers)){
      if(!state.solved.includes(i)){ state.solved.push(i); save(); }
      fb.className="feedback ok";
      fb.innerHTML=`✅ Richtig! Du erhältst den Stein „<b>${s.letter}</b>“.`;
      celebrate();
      const box=inner.querySelector('.answer-row'); if(box) box.style.display="none";
      const sh=document.getElementById('showHint'); if(sh) sh.classList.add('hidden');
      const nx=document.createElement('button'); nx.className="btn secondary"; nx.style.marginTop="12px";
      nx.textContent = (state.solved.length===STATIONS.length) ? "🎉 Zum Lösungswort" : "Weiter zur nächsten Station →";
      nx.onclick=()=> (state.solved.length===STATIONS.length)?showFinal():showHub();
      inner.appendChild(nx);
    } else {
      wrongCount[i]++;
      fb.className="feedback no";
      fb.textContent = wrongCount[i]>=2 ? "Noch nicht richtig – schau dir den Tipp an. 👇" : "Das stimmt noch nicht ganz. Versuch es noch einmal!";
      if(wrongCount[i]>=2){ document.getElementById('showHint').classList.remove('hidden'); }
    }
  };
  document.getElementById('ansGo').onclick=go;
  document.getElementById('ansIn').addEventListener('keydown',e=>{ if(e.key==="Enter") go(); });
  document.getElementById('showHint').onclick=()=>document.getElementById('hintBox').classList.remove('hidden');
}

/* ---------- Kleine Effekte & Lehrer-Code ---------- */
function celebrate(big){
  const em=["🎉","🧱","⭐","🏰","👑","🎊"]; const n=big?26:12;
  for(let k=0;k<n;k++){
    const c=document.createElement('div'); c.className="confetti";
    c.textContent=em[Math.floor(Math.random()*em.length)];
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(2+Math.random()*2)+"s";
    c.style.animationDelay=(Math.random()*.4)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4500);
  }
}
function askTeacher(onOk){
  const code=prompt("Lehrer-/Begleit-Code eingeben:");
  if(code===null) return;
  if(code.trim()===String(SETTINGS.teacherCode)){ onOk(); }
  else alert("Code stimmt nicht.");
}

/* ---------- Los ---------- */
if(state.started){ if(SETTINGS.requireGPS && !state.testMode) startGeo(); showHub(); }
else showStart();
